name: validate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Fails the build on leaked identifiers or misleading stats.
      # This is the only thing standing between an unattended agent commit
      # and a public website, so it runs on every push.
      - run: node scripts/validate.mjs
